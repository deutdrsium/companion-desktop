name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  widget-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libpulse-mainloop-glib0 fonts-noto-cjk
      - name: Install
        run: pip install -e ".[test]"
      - name: Offscreen widget tests
        run: python -m pytest -q -o faulthandler_timeout=120

  privacy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse private assets and local config
        run: |
          bad=$(git ls-files | grep -Ei '\.(moc3|vtube\.json|zip|pem|key)$|(^|/)\.env$|\.local\.|(^|/)saves?/' || true)
          if [ -n "$bad" ]; then echo "Private files tracked:"; echo "$bad"; exit 1; fi

  desktop-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_desktop*.py' -v
        env:
          PYTHONPATH: src:.
