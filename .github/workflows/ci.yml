name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  privacy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse private assets and local config
        run: |
          bad=$(git ls-files | grep -Ei '\.(moc3|vtube\.json|zip|pem|key)$|(^|/)\.env$|\.local\.|(^|/)saves?/' || true)
          if [ -n "$bad" ]; then echo "Private files tracked:"; echo "$bad"; exit 1; fi
